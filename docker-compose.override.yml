# Локальные надстройки: порты наружу. compose подхватывает этот файл сам, а
# скрипты развёртывания берут его только там, где не задана HD_EDGE_NETWORK, —
# то есть на машине разработки. На сервере порты наружу означали бы вход в
# базу и API из интернета.
services:
  postgres:
    ports:
      # Порт базы наружу нужен для миграций и интеграционных тестов с хоста.
      - '${HD_POSTGRES_PORT:-5436}:5432'

  api:
    ports:
      # Порт API наружу нужен, пока веб-приложения и прокси ещё нет.
      - '${HD_API_PORT:-3001}:3001'

  proxy:
    ports:
      # Вход в стек на машине разработки. На сервере порты не публикуются
      # вовсе: туда ходит прокси CAIRN по общей сети.
      - '${HD_HTTP_PORT:-8090}:80'
