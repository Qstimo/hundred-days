# Имя проекта задано явно: на машине рядом стоит стек CAIRN, и выведенное из
# имени каталога однажды совпало бы.
name: hundred-days

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hundred_days
      POSTGRES_USER: hd_owner
      POSTGRES_PASSWORD: ${HD_POSTGRES_PASSWORD:?HD_POSTGRES_PASSWORD не задан}
      HD_APP_PASSWORD: ${HD_APP_PASSWORD:?HD_APP_PASSWORD не задан}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Порт наружу не публикуется: приложение ходит в базу по внутренней сети.
    # Локальной разработке порт нужен — его добавляет
    # docker-compose.override.yml, который compose подхватывает сам.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hd_owner -d hundred_days']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    # Имя образа задано явно, а не выведено из имени каталога: развёртывание
    # помечает им предыдущую сборку, и откат возвращает тот же образ.
    image: hundred-days-api:latest
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      HD_DATABASE_URL: postgres://hd_app:${HD_APP_PASSWORD:?}@postgres:5432/hundred_days
      HD_DATABASE_OWNER_URL: postgres://hd_owner:${HD_POSTGRES_PASSWORD:?}@postgres:5432/hundred_days
      HD_TIMEZONE: ${HD_TIMEZONE:-Europe/Moscow}
      HD_SECURE_COOKIE: ${HD_SECURE_COOKIE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Свой адрес живости: у него нет ни аутентификации, ни обращения к базе.
      # В distroless нет оболочки — бинарник проверяет себя сам.
      test: ['CMD', '/api', '-healthcheck']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  web:
    image: hundred-days-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      # Внутренний адрес API для серверных компонентов Next. В бою браузер
      # ходит по «/api» через прокси, а серверные компоненты — напрямую:
      # запрос изнутри сети не должен выходить наружу и возвращаться.
      HD_API_INTERNAL_URL: http://api:3001
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Проверка по «/login», а не по «/»: главная уводит на вход
      # перенаправлением, и проверка по ней зависела бы от того, как fetch
      # обходится с перенаправлением.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    # Порты наружу не публикуются: на сервере в стек ходит прокси CAIRN по
    # общей сети (docker-compose.server.yml), и открытый порт был бы вторым
    # входом в обход TLS. Машине разработки вход нужен — его открывает
    # docker-compose.override.yml, который compose подхватывает сам.
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # Миграции. Отдельная служба, а не шаг на машине: на сервере нет ни Go, ни
  # клиента PostgreSQL, а база наружу не публикуется — достать её можно
  # только изнутри сети стека.
  #
  # Профиль «tools» означает, что `compose up` эту службу не поднимает:
  # миграции запускает развёртывание одной командой и ждёт её завершения.
  migrator:
    image: hundred-days-migrator:latest
    build:
      context: .
      dockerfile: api/Dockerfile.migrate
    profiles: [tools]
    environment:
      GOOSE_DRIVER: postgres
      # Владелец схемы, а не роль приложения: та права менять таблицы не
      # имеет, и это намеренно.
      GOOSE_DBSTRING: postgres://hd_owner:${HD_POSTGRES_PASSWORD:?}@postgres:5432/hundred_days?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  # Том Caddy: сертификатов здесь нет (TLS держит прокси CAIRN), но в нём
  # лежит остальное состояние, и без тома оно пересоздавалось бы при каждом
  # запуске.
  caddy-data:
