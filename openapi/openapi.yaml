openapi: 3.0.3
info:
  title: 100 дней до
  version: 1.0.0
  description: |
    Контракт — единственный источник типов для обеих сторон. Из него
    порождаются модели и интерфейс сервера на Go, а также типы и клиент на
    TypeScript. Сгенерированный код коммитится, CI следит, чтобы он не
    разошёлся со спецификацией.

servers:
  - url: /api

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hd_session

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Сообщение для человека.
        code:
          type: string
          description: |
            Машинный повод отказа. Интерфейсу нужен не текст, а основание
            показать своё сообщение у конкретного поля.

    User:
      type: object
      required: [id, login, name]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string }
        name: { type: string }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    Settings:
      type: object
      required: [periodTitle, periodStart, periodDays, sleepEnabled]
      properties:
        periodTitle: { type: string, maxLength: 200 }
        periodStart: { type: string, format: date }
        periodDays: { type: integer, minimum: 1, maximum: 3650 }
        sleepEnabled:
          type: boolean
          description: Показывать ли блок сна на странице дня.

    Period:
      description: |
        Вычисляется на сервере по дате начала и длительности. Не хранится:
        хранимый остаток разошёлся бы с календарём на следующий же день.
      type: object
      required: [title, start, days, today, dayNumber, daysLeft]
      properties:
        title: { type: string }
        start: { type: string, format: date }
        days: { type: integer }
        today:
          type: string
          format: date
          description: |
            Сегодняшняя дата по зоне сервера. Живёт здесь, а не отдельным
            полем в каждом ответе: это такая же вычисленная величина, как
            номер дня и остаток.

            Клиенту она нужна, чтобы знать, открыт прошлый день, сегодняшний
            или будущий, и чтобы отсчитывать отрезки дашборда. Выводить её
            арифметикой «начало плюс номер дня» нельзя: у не начавшегося
            периода номер нулевой. Браузерная дата тоже не годится — она
            разойдётся с серверной в полночь.
        dayNumber:
          type: integer
          description: Номер сегодняшнего дня, с единицы. Ноль — период ещё не начался.
        daysLeft:
          type: integer
          description: Остаток дней, считая сегодняшний. Ноль — период завершён.

    SettingsResponse:
      type: object
      required: [settings, period]
      properties:
        settings: { $ref: '#/components/schemas/Settings' }
        period: { $ref: '#/components/schemas/Period' }

    Skill:
      type: object
      required: [id, title, targetPoints, unitLabel, sortOrder, archived]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        targetPoints:
          type: number
          minimum: 0.01
          description: Цель в поинтах. Строго больше нуля — иначе прогресс делил бы на ноль.
        unitLabel:
          type: string
          maxLength: 50
          description: Подпись единицы, например «занятие». Нужна только для текста.
        sortOrder: { type: integer }
        archived:
          type: boolean
          description: Архивный навык в списки не попадает без явного запроса.

    SkillInput:
      type: object
      required: [title, targetPoints]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        targetPoints: { type: number, minimum: 0.01 }
        unitLabel: { type: string, maxLength: 50 }
        sortOrder: { type: integer }
        archived: { type: boolean }

    TrackerMode:
      type: string
      enum: [check, check_hours]
      description: |
        `check` — только галочка. `check_hours` — галочка и часы.

    PointsRule:
      type: string
      enum: [per_check, per_hour]
      description: |
        За что начисляются поинты. `per_hour` допустимо только при
        `mode: check_hours` — у трекера без часов правило давало бы ноль при
        каждом выполнении. Негодное сочетание отвергается кодом 409 с
        поводом `rule_needs_hours`.

    Tracker:
      type: object
      required: [id, title, mode, pointsRule, pointsValue, weeklyTarget,
                 sortOrder, archived, entryCount]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        mode: { $ref: '#/components/schemas/TrackerMode' }
        pointsRule: { $ref: '#/components/schemas/PointsRule' }
        pointsValue:
          type: number
          minimum: 0
          description: Сколько поинтов даёт выполнение или час.
        skillId:
          type: integer
          format: int64
          nullable: true
          description: Навык, который трекер питает. Необязателен.
        weeklyTarget:
          type: integer
          minimum: 1
          maximum: 7
          description: Сколько раз в неделю. По нему считается серия.
        sortOrder: { type: integer }
        archived: { type: boolean }
        entryCount:
          type: integer
          description: |
            Сколько отметок накоплено. Нужно, чтобы удаление могло сказать,
            сколько истории унесёт.

    TrackerInput:
      type: object
      required: [title, mode, pointsRule, pointsValue, weeklyTarget]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        mode: { $ref: '#/components/schemas/TrackerMode' }
        pointsRule: { $ref: '#/components/schemas/PointsRule' }
        pointsValue: { type: number, minimum: 0 }
        skillId: { type: integer, format: int64, nullable: true }
        weeklyTarget: { type: integer, minimum: 1, maximum: 7 }
        sortOrder: { type: integer }
        archived: { type: boolean }

    Entry:
      description: |
        Отметка выполнения трекера за день. Существование отметки и есть
        «сделано»: отдельного значения «не сделано» нет, снятие галочки
        удаляет запись.
      type: object
      required: [date, pointsAwarded]
      properties:
        date: { type: string, format: date }
        hours:
          type: number
          nullable: true
          minimum: 0
          maximum: 24
          description: Часы. Только у трекера с режимом `check_hours`.
        pointsAwarded:
          type: number
          description: |
            Поинты, зафиксированные в момент записи. Правка цены трекера их
            не меняет: иначе весь прошлый прогресс навыка переписывался бы
            от изменения настройки, а не от сделанной работы.

    EntryInput:
      type: object
      properties:
        hours:
          type: number
          nullable: true
          minimum: 0
          maximum: 24

    Sleep:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        wentToBedAt:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Время суток «ЧЧ:ММ». Во сколько лёг.
        wokeUpAt:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Время суток «ЧЧ:ММ». Во сколько встал.
        quality:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: Самооценка сна.
        durationMinutes:
          type: integer
          nullable: true
          readOnly: true
          description: |
            Длительность в минутах. Вычисляется, не хранится. Переход через
            полночь учтён: лёг в 23:40, встал в 7:10 — 450 минут. Пусто,
            если заполнено только одно из двух времён.

    SleepInput:
      type: object
      properties:
        wentToBedAt:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        wokeUpAt:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        quality: { type: integer, nullable: true, minimum: 1, maximum: 5 }

    DayPlan:
      type: object
      required: [id, date, title, done, sortOrder]
      properties:
        id: { type: integer, format: int64 }
        date: { type: string, format: date }
        title: { type: string, minLength: 1, maxLength: 500 }
        done: { type: boolean }
        doneAt: { type: string, format: date-time, nullable: true }
        sortOrder: { type: integer }
        carriedFromId:
          type: integer
          format: int64
          nullable: true
          description: |
            След переноса: пункт скопирован со вчера. В исходном дне он
            остаётся незакрытым — видно, что планировалось и уехало, а не
            исчезло.

    DayPlanCreate:
      type: object
      required: [date, title]
      properties:
        date: { type: string, format: date }
        title: { type: string, minLength: 1, maxLength: 500 }
        sortOrder: { type: integer }

    DayPlanPatch:
      description: |
        Правятся только присланные поля. Отсутствие поля — «не менять», а не
        «очистить».
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        done: { type: boolean }
        sortOrder: { type: integer }

    CarryOverRequest:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
          description: День, в который переносим. Берём из предыдущего.

    DayTracker:
      type: object
      required: [tracker, weekDone, weekTarget]
      properties:
        tracker: { $ref: '#/components/schemas/Tracker' }
        entry:
          allOf: [{ $ref: '#/components/schemas/Entry' }]
          nullable: true
          description: Отметка за этот день. Пусто — не сделано.
        weekDone:
          type: integer
          description: |
            Сколько раз выполнен на неделе, в которую попадает запрошенная
            дата. Неделя считается с понедельника.
        weekTarget: { type: integer }

    DaySkill:
      type: object
      required: [skill, earnedPoints]
      properties:
        skill: { $ref: '#/components/schemas/Skill' }
        earnedPoints:
          type: number
          description: |
            Забрано поинтов за всё время. Сумма зафиксированных в отметках
            значений, а не пересчёт по текущей цене трекеров.

    DayResponse:
      type: object
      required: [date, period, sleepEnabled, trackers, plans,
                 carryOverAvailable, skills]
      properties:
        date: { type: string, format: date }
        period: { $ref: '#/components/schemas/Period' }
        sleepEnabled: { type: boolean }
        sleep:
          allOf: [{ $ref: '#/components/schemas/Sleep' }]
          nullable: true
        trackers:
          type: array
          items: { $ref: '#/components/schemas/DayTracker' }
        plans:
          type: array
          items: { $ref: '#/components/schemas/DayPlan' }
        carryOverAvailable:
          type: boolean
          description: |
            Есть ли что переносить со вчера. Кнопка показывается только тогда.
        skills:
          type: array
          items: { $ref: '#/components/schemas/DaySkill' }

    StatsDay:
      type: object
      required: [date, done, points]
      properties:
        date: { type: string, format: date }
        done: { type: boolean }
        hours: { type: number, nullable: true }
        points: { type: number }

    StatsTracker:
      type: object
      required: [trackerId, title, mode, weeklyTarget, days, totalDone,
                 totalHours, totalPoints, completionRate, currentStreak,
                 bestStreak, currentWeekDone]
      properties:
        trackerId: { type: integer, format: int64 }
        title: { type: string }
        mode: { $ref: '#/components/schemas/TrackerMode' }
        weeklyTarget: { type: integer }
        days:
          type: array
          description: |
            По дню на каждый день отрезка, включая пустые: теплокарте нужны
            и провалы, а пропуск дня сдвинул бы сетку.
          items: { $ref: '#/components/schemas/StatsDay' }
        totalDone: { type: integer }
        totalHours: { type: number }
        totalPoints: { type: number }
        completionRate:
          type: number
          description: |
            Доля выполненного от ожидаемого за отрезок. Единица — ровно по
            плану, больше единицы — перевыполнение, и оно не обрезается.
        currentStreak:
          type: integer
          description: |
            Недель подряд с взятой целью. Текущая незакончившаяся неделя
            серию не рвёт, но уже зачтённая — продолжает.
        bestStreak: { type: integer }
        currentWeekDone: { type: integer }

    StatsSkill:
      type: object
      required: [skillId, title, unitLabel, targetPoints, earnedPoints,
                 pacePerDay, forecast, willReach]
      properties:
        skillId: { type: integer, format: int64 }
        title: { type: string }
        unitLabel: { type: string }
        targetPoints: { type: number }
        earnedPoints: { type: number }
        pacePerDay:
          type: number
          description: Поинтов в день по последним 14 дням.
        forecast:
          type: number
          description: Сколько будет к концу периода, если темп сохранится.
        willReach: { type: boolean }

    StatsSleep:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        wentToBedAt: { type: string, nullable: true }
        wokeUpAt: { type: string, nullable: true }
        durationMinutes: { type: integer, nullable: true }
        quality: { type: integer, nullable: true }

    StatsPlans:
      type: object
      required: [total, done, rate]
      properties:
        total: { type: integer }
        done: { type: integer }
        rate:
          type: number
          description: |
            Доля закрытых планов за отрезок. Отдельная метрика: на поинты и
            навыки планы не влияют.

    StatsResponse:
      type: object
      required: [from, to, trackers, skills, sleep, plans]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        trackers:
          type: array
          items: { $ref: '#/components/schemas/StatsTracker' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/StatsSkill' }
        sleep:
          type: array
          items: { $ref: '#/components/schemas/StatsSleep' }
        plans: { $ref: '#/components/schemas/StatsPlans' }

    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string }

  responses:
    Unauthorized:
      description: Нет сессии или она истекла
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        Нет такой записи. Отвечается и когда запись чужая: ответ 403 сообщил
        бы, что она существует.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Нарушен инвариант
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Данные не годятся
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - sessionCookie: []

paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Проверка живости
      description: |
        Не обращается ни к базе, ни к сессии: ручку спрашивает docker compose
        в момент, когда остальное может быть не поднято.
      responses:
        '200':
          description: Живо
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /auth/login:
    post:
      operationId: login
      security: []
      summary: Вход по логину и паролю
      description: |
        Неизвестный логин и неверный пароль отвечают одинаково: разный ответ
        сказал бы, какие логины в системе есть.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Вошли, cookie сессии выдана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      security: []
      summary: Выход
      description: |
        Идемпотентен: отсутствие cookie — тоже успех. Открыт без сессии,
        потому что выход с истёкшей сессией должен гасить cookie, а не
        отвечать отказом.
      responses:
        '204':
          description: Вышли, cookie погашена

  /auth/me:
    get:
      operationId: getMe
      summary: Текущий пользователь
      responses:
        '200':
          description: Пользователь сессии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings:
    get:
      operationId: getSettings
      summary: Настройки и вычисленный период
      description: |
        Отдаёт оба сразу: интерфейсу нужны и настройки, и шапка периода, и
        второй запрос ради шапки был бы лишним.
      responses:
        '200':
          description: Настройки и период
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putSettings
      summary: Сохранить настройки
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: Сохранено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /skills:
    get:
      operationId: listSkills
      summary: Навыки
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Включить архивные.
      responses:
        '200':
          description: Список навыков
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Skill' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createSkill
      summary: Завести навык
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillInput' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /skills/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updateSkill
      summary: Правка навыка
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillInput' }
      responses:
        '200':
          description: Сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteSkill
      summary: Удалить навык
      description: |
        Записи не удаляются: трекеры теряют ссылку на навык, а накопленные
        поинты остаются в записях. Это не недосмотр — поинты зафиксированы
        в момент выполнения, и удаление цели не отменяет сделанной работы.
      responses:
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trackers:
    get:
      operationId: listTrackers
      summary: Трекеры
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Список трекеров
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tracker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createTracker
      summary: Завести трекер
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackerInput' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tracker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            Указан навык, которого нет или который принадлежит другому.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /trackers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updateTracker
      summary: Правка трекера
      description: |
        Инвариант сочетания режима и правила проверяется так же, как при
        создании: сменить режим на «без часов», оставив правило «за час»,
        нельзя.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackerInput' }
      responses:
        '200':
          description: Сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tracker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteTracker
      summary: Удалить трекер
      description: |
        Уносит все его отметки: они принадлежат трекеру и без него значения
        не имеют. Сколько именно — говорит поле `entryCount` в списке, чтобы
        интерфейс мог предупредить до удаления.
      responses:
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trackers/{id}/entries/{date}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: date
        in: path
        required: true
        schema: { type: string, format: date }
    put:
      operationId: putEntry
      summary: Отметить выполнение
      description: |
        Повторный вызов перезаписывает часы и пересчитывает поинты по текущей
        цене трекера — это правка отметки за тот день, а не новая запись.

        Правило «за час» без часов отвергается: отметить выполнение, не
        сказав сколько, значит начислить ноль, и это почти наверняка ошибка.

        Дата в будущем отвергается. «Сегодня» определяет сервер по своей
        зоне, а не браузер.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryInput' }
      responses:
        '200':
          description: Отметка поставлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteEntry
      summary: Снять отметку
      responses:
        '204': { description: Снята }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sleep/{date}:
    parameters:
      - name: date
        in: path
        required: true
        schema: { type: string, format: date }
        description: Дата подъёма — день, к которому относится сон.
    put:
      operationId: putSleep
      summary: Записать сон
      description: |
        Все три значения необязательны: заполнить только время подъёма —
        нормально. Длительность считается сервером, присылать её не нужно.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SleepInput' }
      responses:
        '200':
          description: Записано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sleep' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteSleep
      summary: Убрать запись сна
      responses:
        '204': { description: Убрана }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /day-plans:
    post:
      operationId: createDayPlan
      summary: Добавить пункт плана
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DayPlanCreate' }
      responses:
        '201':
          description: Добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /day-plans/carry-over:
    post:
      operationId: carryOverDayPlans
      summary: Подтянуть незакрытые со вчера
      description: |
        Копирует незакрытые пункты предыдущего дня в указанный, оставляя
        исходные на месте. Идемпотентно: пункт, у которого в целевом дне уже
        есть копия, пропускается — двойное нажатие не удвоит список.

        Автоматического переноса нет: он размыл бы историю дня, а она здесь и
        есть содержание.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarryOverRequest' }
      responses:
        '200':
          description: Созданные пункты. Пустой список — переносить было нечего.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DayPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /day-plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: patchDayPlan
      summary: Правка пункта
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DayPlanPatch' }
      responses:
        '200':
          description: Сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteDayPlan
      summary: Удалить пункт
      responses:
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /day:
    get:
      operationId: getDay
      summary: Всё для страницы дня
      description: |
        Один ответ, а не шесть запросов: это главный экран, он открывается
        каждый день, и собранный из кусков показывал бы шесть индикаторов
        загрузки вместо одного.

        Без параметра `date` отдаётся сегодня — по зоне сервера, а не
        браузера.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Данные дня
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /stats:
    get:
      operationId: getStats
      summary: Статистика за отрезок
      description: |
        Всё для дашборда одним ответом. Отрезок включает оба края.

        Длина ограничена 400 днями: ответ отдаёт по дню на каждый трекер, и
        пять лет превратились бы в мегабайты, которые всё равно не прочесть.

        Серии считаются по всей истории, а не по отрезку: серия, начавшаяся
        до его начала, иначе выглядела бы короче, чем она есть.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Статистика
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
