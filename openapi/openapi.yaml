openapi: 3.0.3
info:
  title: 100 дней до
  version: 1.0.0
  description: |
    Контракт — единственный источник типов для обеих сторон. Из него
    порождаются модели и интерфейс сервера на Go, а также типы и клиент на
    TypeScript. Сгенерированный код коммитится, CI следит, чтобы он не
    разошёлся со спецификацией.

servers:
  - url: /api

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hd_session

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Сообщение для человека.
        code:
          type: string
          description: |
            Машинный повод отказа. Интерфейсу нужен не текст, а основание
            показать своё сообщение у конкретного поля.

    User:
      type: object
      required: [id, login, name]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string }
        name: { type: string }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    Settings:
      type: object
      required: [periodTitle, periodStart, periodDays, sleepEnabled]
      properties:
        periodTitle: { type: string, maxLength: 200 }
        periodStart: { type: string, format: date }
        periodDays: { type: integer, minimum: 1, maximum: 3650 }
        sleepEnabled:
          type: boolean
          description: Показывать ли блок сна на странице дня.

    Period:
      description: |
        Вычисляется на сервере по дате начала и длительности. Не хранится:
        хранимый остаток разошёлся бы с календарём на следующий же день.
      type: object
      required: [title, start, days, dayNumber, daysLeft]
      properties:
        title: { type: string }
        start: { type: string, format: date }
        days: { type: integer }
        dayNumber:
          type: integer
          description: Номер сегодняшнего дня, с единицы. Ноль — период ещё не начался.
        daysLeft:
          type: integer
          description: Остаток дней, считая сегодняшний. Ноль — период завершён.

    SettingsResponse:
      type: object
      required: [settings, period]
      properties:
        settings: { $ref: '#/components/schemas/Settings' }
        period: { $ref: '#/components/schemas/Period' }

    Skill:
      type: object
      required: [id, title, targetPoints, unitLabel, sortOrder, archived]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        targetPoints:
          type: number
          minimum: 0.01
          description: Цель в поинтах. Строго больше нуля — иначе прогресс делил бы на ноль.
        unitLabel:
          type: string
          maxLength: 50
          description: Подпись единицы, например «занятие». Нужна только для текста.
        sortOrder: { type: integer }
        archived:
          type: boolean
          description: Архивный навык в списки не попадает без явного запроса.

    SkillInput:
      type: object
      required: [title, targetPoints]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        targetPoints: { type: number, minimum: 0.01 }
        unitLabel: { type: string, maxLength: 50 }
        sortOrder: { type: integer }
        archived: { type: boolean }

    TrackerMode:
      type: string
      enum: [check, check_hours]
      description: |
        `check` — только галочка. `check_hours` — галочка и часы.

    PointsRule:
      type: string
      enum: [per_check, per_hour]
      description: |
        За что начисляются поинты. `per_hour` допустимо только при
        `mode: check_hours` — у трекера без часов правило давало бы ноль при
        каждом выполнении. Негодное сочетание отвергается кодом 409 с
        поводом `rule_needs_hours`.

    Tracker:
      type: object
      required: [id, title, mode, pointsRule, pointsValue, weeklyTarget,
                 sortOrder, archived, entryCount]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        mode: { $ref: '#/components/schemas/TrackerMode' }
        pointsRule: { $ref: '#/components/schemas/PointsRule' }
        pointsValue:
          type: number
          minimum: 0
          description: Сколько поинтов даёт выполнение или час.
        skillId:
          type: integer
          format: int64
          nullable: true
          description: Навык, который трекер питает. Необязателен.
        weeklyTarget:
          type: integer
          minimum: 1
          maximum: 7
          description: Сколько раз в неделю. По нему считается серия.
        sortOrder: { type: integer }
        archived: { type: boolean }
        entryCount:
          type: integer
          description: |
            Сколько отметок накоплено. Нужно, чтобы удаление могло сказать,
            сколько истории унесёт.

    TrackerInput:
      type: object
      required: [title, mode, pointsRule, pointsValue, weeklyTarget]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        mode: { $ref: '#/components/schemas/TrackerMode' }
        pointsRule: { $ref: '#/components/schemas/PointsRule' }
        pointsValue: { type: number, minimum: 0 }
        skillId: { type: integer, format: int64, nullable: true }
        weeklyTarget: { type: integer, minimum: 1, maximum: 7 }
        sortOrder: { type: integer }
        archived: { type: boolean }

    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string }

  responses:
    Unauthorized:
      description: Нет сессии или она истекла
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        Нет такой записи. Отвечается и когда запись чужая: ответ 403 сообщил
        бы, что она существует.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Нарушен инвариант
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Данные не годятся
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - sessionCookie: []

paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Проверка живости
      description: |
        Не обращается ни к базе, ни к сессии: ручку спрашивает docker compose
        в момент, когда остальное может быть не поднято.
      responses:
        '200':
          description: Живо
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /auth/login:
    post:
      operationId: login
      security: []
      summary: Вход по логину и паролю
      description: |
        Неизвестный логин и неверный пароль отвечают одинаково: разный ответ
        сказал бы, какие логины в системе есть.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Вошли, cookie сессии выдана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      security: []
      summary: Выход
      description: |
        Идемпотентен: отсутствие cookie — тоже успех. Открыт без сессии,
        потому что выход с истёкшей сессией должен гасить cookie, а не
        отвечать отказом.
      responses:
        '204':
          description: Вышли, cookie погашена

  /auth/me:
    get:
      operationId: getMe
      summary: Текущий пользователь
      responses:
        '200':
          description: Пользователь сессии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings:
    get:
      operationId: getSettings
      summary: Настройки и вычисленный период
      description: |
        Отдаёт оба сразу: интерфейсу нужны и настройки, и шапка периода, и
        второй запрос ради шапки был бы лишним.
      responses:
        '200':
          description: Настройки и период
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putSettings
      summary: Сохранить настройки
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: Сохранено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /skills:
    get:
      operationId: listSkills
      summary: Навыки
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Включить архивные.
      responses:
        '200':
          description: Список навыков
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Skill' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createSkill
      summary: Завести навык
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillInput' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /skills/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updateSkill
      summary: Правка навыка
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillInput' }
      responses:
        '200':
          description: Сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteSkill
      summary: Удалить навык
      description: |
        Записи не удаляются: трекеры теряют ссылку на навык, а накопленные
        поинты остаются в записях. Это не недосмотр — поинты зафиксированы
        в момент выполнения, и удаление цели не отменяет сделанной работы.
      responses:
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trackers:
    get:
      operationId: listTrackers
      summary: Трекеры
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Список трекеров
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tracker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createTracker
      summary: Завести трекер
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackerInput' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tracker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            Указан навык, которого нет или который принадлежит другому.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /trackers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updateTracker
      summary: Правка трекера
      description: |
        Инвариант сочетания режима и правила проверяется так же, как при
        создании: сменить режим на «без часов», оставив правило «за час»,
        нельзя.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackerInput' }
      responses:
        '200':
          description: Сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tracker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteTracker
      summary: Удалить трекер
      description: |
        Уносит все его отметки: они принадлежат трекеру и без него значения
        не имеют. Сколько именно — говорит поле `entryCount` в списке, чтобы
        интерфейс мог предупредить до удаления.
      responses:
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
