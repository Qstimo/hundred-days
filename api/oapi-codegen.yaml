# Настройка oapi-codegen. Лежит рядом с кодом, который порождает: tools.sh
# запускает инструменты из каталога api, и пути отсчитываются оттуда.
package: gen
output: internal/httpapi/gen/server.gen.go
generate:
  # Модели и интерфейс сервера, но не маршрутизатор со строгими ответами.
  # Маршруты пишутся руками: строгий сервер раздавал бы их сам, и границу
  # «открыто / под сессией» пришлось бы ставить посредником, разбирающим
  # путь запроса. Для границы аутентификации это плохой приём — ошибка в
  # сравнении пути открывает наружу всё. Соответствие спецификации при этом
  # проверяется строкой `var _ gen.ServerInterface = (*Server)(nil)`.
  chi-server: true
  models: true
  embedded-spec: false
