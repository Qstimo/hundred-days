name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: api/go.sum
      - name: Тесты
        working-directory: api
        run: go test ./... -race

      # Сгенерированный код коммитится, а CI следит, чтобы он не разошёлся с
      # источником: иначе расхождение спецификации и кода обнаружилось бы
      # только в рантайме. Шаг включается в чанке 3, когда появятся
      # sqlc.yaml и openapi.yaml.
      # - name: Сгенерированное не разошлось с источником
      #   working-directory: api
      #   run: |
      #     ./tools.sh sqlc generate
      #     ./tools.sh oapi-codegen -config ../openapi/oapi-codegen.yaml ../openapi/openapi.yaml
      #     git diff --exit-code || {
      #       echo 'Сгенерированный код разошёлся: перегенерируй и закоммить'
      #       exit 1
      #     }

  # Задание web включается в чанке 7, когда появится веб-приложение.
