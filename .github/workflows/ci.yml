name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: api/go.sum
      - name: Тесты
        working-directory: api
        run: go test ./... -race

      # Сгенерированный код коммитится, а CI следит, чтобы он не разошёлся с
      # источником: иначе расхождение спецификации и кода обнаружилось бы
      # только в рантайме.
      - name: Сгенерированное не разошлось с источником
        working-directory: api
        run: |
          ./tools.sh sqlc generate
          ./tools.sh oapi-codegen -config oapi-codegen.yaml ../openapi/openapi.yaml
          git diff --exit-code || {
            echo 'Сгенерированный код разошёлся: перегенерируй и закоммить'
            exit 1
          }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Типы
        working-directory: web
        run: pnpm typecheck
      - name: Тесты
        working-directory: web
        run: pnpm test run
      - name: Сборка
        working-directory: web
        run: pnpm build
      - name: Типы клиента не разошлись со спецификацией
        working-directory: web
        run: |
          pnpm api:types
          git diff --exit-code src/api-client/schema.d.ts || {
            echo 'Типы клиента разошлись со спецификацией: перегенерируй и закоммить'
            exit 1
          }
