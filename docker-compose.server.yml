# Надстройка для сервера: подключение к прокси CAIRN.
#
# Наружу этот стек не публикует ни одного порта. Прокси CAIRN находит его по
# имени в общей сети — это единственный вход, и открытый порт был бы вторым,
# в обход TLS.
#
# Отдельным файлом, а не в основном: сеть создаёт стек CAIRN, и на машине
# разработки её нет — основной файл обязан поднимать стек и без неё.
# Подключается скриптами, когда в .env задана HD_EDGE_NETWORK.
services:
  proxy:
    networks:
      # Сеть стека перечислена явно: как только у службы появляется список
      # сетей, compose перестаёт подключать её к своей сети сам, и прокси
      # потерял бы из виду web и api.
      default: {}
      edge:
        # Имя в общей сети. Имя службы не подходит: у прокси CAIRN оно такое
        # же — «proxy», — и в одной сети два одинаковых имени не разойдутся.
        aliases: [hundred-days]

networks:
  edge:
    name: ${HD_EDGE_NETWORK:?HD_EDGE_NETWORK не задан}
    # Сеть чужая: её создаёт стек CAIRN. Зависимость направлена так нарочно —
    # CAIRN не должен падать из-за того, что соседа ещё не развернули.
    external: true
